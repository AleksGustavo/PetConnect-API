name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      # Não há Maven Wrapper no repo (ver docs/next-stage/01-baseline-audit.md
      # em PetConnect) — usa o Maven do runner. O Mongo dos testes é
      # embarcado (flapdoodle, configurado em src/test/resources/application.yml),
      # não precisa de service container.
      - name: mvn test
        run: mvn -B test

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
