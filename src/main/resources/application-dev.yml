# Ambiente de desenvolvimento local.
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/petconnect_dev}

management:
  endpoint:
    health:
      show-details: always

petconnect:
  cors:
    allowed-origins:
      - http://localhost
      - http://localhost:3000
      - http://10.0.2.2        # emulador Android acessando o host

logging:
  level:
    com.petconnect.api: DEBUG
    org.springframework.web: INFO
