# Ambiente de desenvolvimento local.
# Container dedicado 'petconnect-mongo' na porta 27018 (27017 costuma estar ocupada
# por outra instalacao). Suba com: docker compose up -d  (compose.yaml na raiz)
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/petconnect}

management:
  endpoint:
    health:
      show-details: always

petconnect:
  cors:
    allowed-origins:
      - http://localhost
      - http://localhost:3000
      - http://10.0.2.2        # emulador Android acessando o host
  firebase:
    # Caminho para o JSON da conta de serviço DEDICADA ao backend (fora do repo).
    # Defina no ambiente: FIREBASE_SERVICE_ACCOUNT=C:\caminho\para\petconnect-backend-sa.json
    service-account: ${FIREBASE_SERVICE_ACCOUNT:}

logging:
  level:
    com.petconnect.api: DEBUG
    org.springframework.web: INFO
