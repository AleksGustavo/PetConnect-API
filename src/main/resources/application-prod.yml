# Ambiente de produção. Nada sensível aqui — só env vars.
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}   # Atlas (prod) — obrigatório

petconnect:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: WARN
    com.petconnect.api: INFO
