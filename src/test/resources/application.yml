# Config de teste — MongoDB embarcado (flapdoodle), sem depender de instância externa.
# NÃO definir spring.data.mongodb.uri aqui: o flapdoodle escolhe host/porta livres
# e conecta o client. Definir apenas o nome do banco.
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.14

spring:
  data:
    mongodb:
      database: petconnect_test
      auto-index-creation: true

petconnect:
  cors:
    allowed-origins:
      - http://localhost
  firebase:
    service-account: ""
    project-id: pet-connect-c53f1
  cloudinary:
    # Valores de teste — nunca reais. CloudinaryClient é mockado nos testes
    # que chamam destroy(); nenhum desses valores sai para a internet.
    cloud-name: test-cloud
    api-key: test-api-key
    api-secret: test-api-secret
